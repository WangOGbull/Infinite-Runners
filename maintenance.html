<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>Infinite Arena Update</title>
<style>
:root{--cyan:#22dff4;--violet:#9a59ec;--gold:#e8c66c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#02030a;color:#fff}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.bg,.shade{position:fixed;inset:0;width:100%;height:100%}
.bg{object-fit:cover;opacity:.36;filter:saturate(.85) brightness(.58)}
.shade{background:radial-gradient(circle at 50% 45%,rgba(31,25,75,.06),rgba(2,3,10,.55) 60%,rgba(2,3,10,.9))}
.wrap{position:relative;z-index:1;width:100%;height:100dvh;display:grid;place-items:center;padding:24px}
.card{width:min(88vw,440px);padding:30px 24px 27px;text-align:center;background:linear-gradient(145deg,rgba(7,10,25,.72),rgba(8,5,22,.82));border:1px solid rgba(99,211,237,.2);border-radius:22px;box-shadow:0 20px 70px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.mark{width:min(58vw,230px);margin:0 auto 20px;filter:drop-shadow(0 0 10px rgba(35,222,244,.32))}
.mark path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.base{stroke:rgba(6,7,19,.9);stroke-width:26}
.rim{stroke:url(#rim);stroke-width:18}
.light{stroke:url(#light);stroke-width:6;stroke-dasharray:26 14;animation:flow 2.4s linear infinite}
.brand{margin-bottom:10px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.25em;text-transform:uppercase}
h1{margin:0;color:#f0e9fb;font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,6vw,36px);line-height:1.12;letter-spacing:.05em;text-shadow:0 0 18px rgba(150,78,225,.32)}
.rule{display:flex;align-items:center;gap:10px;width:155px;margin:18px auto}
.rule:before,.rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--cyan))}
.rule:after{background:linear-gradient(90deg,var(--cyan),transparent)}
.gem{width:7px;height:7px;border:1px solid var(--gold);transform:rotate(45deg)}
.message{margin:0;color:#c8cbd7;font-size:15px;letter-spacing:.05em}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:#88eaf4;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.6s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
@media(max-height:620px){.card{padding:20px}.mark{width:170px;margin-bottom:12px}.rule{margin:13px auto}.status{margin-top:13px}}
@media(max-width:480px){.wrap{padding:18px}.card{width:min(92vw,380px);padding:26px 18px 24px;border-radius:18px}.mark{width:min(55vw,190px)}.brand{font-size:8px}h1{font-size:clamp(23px,7vw,31px)}}
@media(prefers-reduced-motion:reduce){.light,.dot{animation:none}}
</style>
</head>
<body>
<video class="bg" autoplay muted loop playsinline preload="auto" poster="./assets/title-mobile-bg.png">
<source src="./assets/maintenance-space.mp4" type="video/mp4">
</video>
<div class="shade" aria-hidden="true"></div>
<main class="wrap">
<section class="card" aria-label="Arena maintenance notice">
<svg class="mark" viewBox="0 0 600 280" aria-hidden="true">
<defs>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24dff3"/><stop offset=".48" stop-color="#6769e8"/><stop offset=".72" stop-color="#a45be9"/><stop offset="1" stop-color="#24dff3"/></linearGradient>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e8fdff"/><stop offset=".35" stop-color="#29e3f3"/><stop offset=".68" stop-color="#c276f0"/><stop offset="1" stop-color="#29e3f3"/></linearGradient>
</defs>
<path class="base" d="M92 140c0-75 91-90 208 0s208 75 208 0-91-90-208 0S92 215 92 140"/>
<path class="rim" d="M92 140c0-75 91-90 208 0s208 75 208 0-91-90-208 0S92 215 92 140"/>
<path class="light" d="M92 140c0-75 91-90 208 0s208 75 208 0-91-90-208 0S92 215 92 140"/>
</svg>
<div class="brand">Infinite Runners · Dragon Arena</div>
<h1>ARENA UPDATE<br>IN PROGRESS</h1>
<div class="rule"><span class="gem"></span></div>
<p class="message">Check back in 30 minutes.</p>
<div class="status"><span class="dot"></span>Update underway</div>
</section>
</main>
</body>
</html>
